<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DICE workflow</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101412'/%3E%3Cpath d='M8 22V10h3.2c2.7 0 4.3 1.4 4.3 3.5 0 1.5-.8 2.6-2.1 3.1L16.8 22h-2.6l-2.8-5H10.2V22H8zm2.2-6.8h1.1c1.4 0 2.2-.7 2.2-1.7s-.8-1.7-2.2-1.7h-1.1v3.4zM18 22l4.2-12H25l-4.2 12H18z' fill='%23f4efe6'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css?v=4" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="brand">
          <p class="eyebrow">Application migration</p>
          <h1>DICE</h1>
        </div>
        <button id="new-thread" type="button">New migration</button>
        <ul id="thread-list"></ul>
        <p class="user-chip">Workspace · <span id="user-label">local</span></p>
      </aside>
      <main>
        <header id="top">
          <div>
            <p id="phase-kicker" class="eyebrow"></p>
            <h2 id="thread-title">No migration selected</h2>
          </div>
          <div class="top-actions">
            <p id="status-pill" data-state="idle">Ready</p>
            <button id="remove-thread" type="button" hidden>Remove</button>
          </div>
        </header>
        <div id="banner" class="banner" hidden role="alert"></div>
        <div id="transcript"></div>
        <form id="composer">
          <div id="interrupt"></div>
          <div class="composer-row">
            <label class="sr-only" for="draft">Message the supervisor</label>
            <textarea id="draft" rows="2" placeholder="Tell the supervisor what to do" autocomplete="off"></textarea>
            <button id="send" type="submit" disabled>Send</button>
          </div>
          <p class="hint">Enter to send · Shift+Enter for a new line</p>
        </form>
      </main>
      <aside id="rail" aria-label="Workflow">
        <div id="rail-body"></div>
      </aside>
    </div>
    <script src="/app.js?v=4"></script>
    <noscript><p class="noscript">This workflow UI needs JavaScript.</p></noscript>
  </body>
</html>
