[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dice-backend"
version = "0.1.0"
description = "DICE agentic framework — LangGraph orchestrator with deepagents, HITL, and resume"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "deepagents>=0.7",
  "pydantic>=2",
  "pydantic-settings>=2",
  "asyncpg>=0.29",
  "sqlalchemy[asyncio]>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "langchain-quickjs>=0.3",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]
web = [
  "langchain-openai>=0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
